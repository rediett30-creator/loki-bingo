<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Loki Bingo - Select Cartela</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f0c1f 0%, #1a1a2e 100%);
            min-height: 100vh;
            padding: 16px;
            color: #fff;
        }
        
        .container { max-width: 500px; margin: 0 auto; }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .balance-card {
            background: linear-gradient(135deg, #2a2a3e, #1a1a2e);
            padding: 10px 15px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid gold;
        }
        
        .balance-label { font-size: 10px; color: #888; }
        .balance-value { font-size: 18px; font-weight: bold; color: gold; }
        
        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .stat-value { font-size: 28px; font-weight: bold; color: #e94560; }
        .stat-label { font-size: 11px; color: #888; margin-top: 5px; }
        
        /* Timer */
        .timer-box {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-radius: 30px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(233,69,96,0.3);
        }
        
        .timer-label { font-size: 14px; opacity: 0.9; letter-spacing: 2px; }
        .timer-number { font-size: 64px; font-weight: bold; line-height: 1; margin: 10px 0; }
        
        /* Game Info */
        .game-info {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .info-item { text-align: center; flex: 1; }
        .info-value { font-size: 18px; font-weight: bold; color: gold; }
        .info-label { font-size: 10px; color: #888; }
        
        /* Cards Grid */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px 0;
            max-height: 400px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .cartela-card {
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 5px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }
        
        .cartela-card:hover {
            transform: translateY(-3px);
            background: rgba(233,69,96,0.2);
            border-color: #e94560;
        }
        
        .cartela-card.selected {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            border-color: gold;
            transform: scale(1.02);
        }
        
        .cartela-number { font-size: 14px; font-weight: bold; }
        .cartela-price { font-size: 10px; color: gold; margin-top: 5px; }
        
        /* Button */
        .select-btn {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 30px;
            font-size: 20px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .select-btn:hover { transform: scale(1.02); box-shadow: 0 5px 20px rgba(233,69,96,0.4); }
        .select-btn:disabled { background: #444; cursor: not-allowed; transform: none; }
        
        .status { text-align: center; color: #888; margin: 15px 0; font-size: 14px; }
        
        /* Scrollbar */
        .cards-grid::-webkit-scrollbar { width: 4px; }
        .cards-grid::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .cards-grid::-webkit-scrollbar-thumb { background: #e94560; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <h1>🎰 LOKI BINGO</h1>
            </div>
            <div class="balance-card">
                <div class="balance-label">PLAY WALLET</div>
                <div class="balance-value" id="balance">⭐ 1,250</div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="players">0</div>
                <div class="stat-label">PLAYERS</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="selected">0</div>
                <div class="stat-label">SELECTED</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="prizePool">0</div>
                <div class="stat-label">PRIZE</div>
            </div>
        </div>

        <!-- Timer -->
        <div class="timer-box">
            <div class="timer-label">TIME TO SELECT CARD</div>
            <div class="timer-number" id="timer">30</div>
            <div class="timer-label">SECONDS</div>
        </div>

        <!-- Game Info -->
        <div class="game-info">
            <div class="info-item">
                <div class="info-value" id="gameId">------</div>
                <div class="info-label">GAME ID</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="stake">100</div>
                <div class="info-label">BET</div>
            </div>
            <div class="info-item">
                <div class="info-value" id="calledCount">0</div>
                <div class="info-label">CALLED</div>
            </div>
        </div>

        <!-- Cartela Grid -->
        <div class="cards-grid" id="cardsGrid"></div>

        <!-- Select Button -->
        <button class="select-btn" id="selectBtn" disabled>🎲 SELECT CARTELA (100)</button>

        <!-- Status -->
        <div class="status" id="status">Choose your lucky cartela...</div>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.ready();
        tg.expand();

        const playerId = tg.initDataUnsafe?.user?.id || 'guest_' + Math.random();
        const playerName = tg.initDataUnsafe?.user?.first_name || 'Player';
        const socket = io();

        let selectedIndex = -1;
        let allCards = [];
        let balance = 1250;

        socket.emit('join', { playerId, playerName });

        socket.on('gameState', (data) => {
            allCards = data.cards;
            document.getElementById('players').textContent = data.playersCount;
            document.getElementById('selected').textContent = data.selectedCount;
            document.getElementById('prizePool').textContent = data.prizePool;
            document.getElementById('timer').textContent = data.cartelaTimer;
            document.getElementById('gameId').textContent = data.gameId || '------';
            document.getElementById('calledCount').textContent = data.calledCount || 0;
            balance = data.balance || 1250;
            document.getElementById('balance').textContent = `⭐ ${balance}`;
            renderCards();
        });

        socket.on('cartelaTimer', (time) => {
            document.getElementById('timer').textContent = time;
        });

        socket.on('cardSelected', (data) => {
            document.getElementById('selected').textContent = data.selectedCount;
            document.getElementById('prizePool').textContent = data.prizePool;
        });

        socket.on('balance', (bal) => {
            balance = bal;
            document.getElementById('balance').textContent = `⭐ ${balance}`;
        });

        socket.on('phaseChange', (phase) => {
            if (phase === 'game') {
                window.location.href = '/game';
            }
        });

        function renderCards() {
            let html = '';
            for (let i = 0; i < Math.min(50, allCards.length); i++) {
                let isSelected = (selectedIndex === i);
                html += `
                    <div class="cartela-card ${isSelected ? 'selected' : ''}" onclick="selectCard(${i})">
                        <div class="cartela-number">#${i+1}</div>
                        <div class="cartela-price">⭐ 100</div>
                    </div>
                `;
            }
            document.getElementById('cardsGrid').innerHTML = html;
        }

        window.selectCard = function(index) {
            selectedIndex = index;
            document.getElementById('selectBtn').disabled = false;
            renderCards();
        };

        document.getElementById('selectBtn').onclick = () => {
            if (selectedIndex >= 0) {
                socket.emit('selectCard', { playerId, cardIndex: selectedIndex });
                document.getElementById('selectBtn').disabled = true;
                document.getElementById('selectBtn').innerHTML = '✓ CARTELA SELECTED';
                document.getElementById('status').innerHTML = 'Waiting for game to start...';
            }
        };
    </script>
</body>
</html>

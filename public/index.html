<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loki Bingo - Select Card</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: #e94560; text-align: center; font-size: 40px; margin: 20px 0; }
        .timer-box { background: #16213e; border-radius: 20px; padding: 20px; text-align: center; margin: 20px 0; border: 2px solid #e94560; }
        .timer-number { font-size: 64px; font-weight: bold; color: #e94560; }
        .stats { display: flex; justify-content: space-between; background: #0f3460; padding: 15px; border-radius: 15px; margin: 20px 0; }
        .stat { text-align: center; flex: 1; }
        .stat-value { font-size: 24px; font-weight: bold; color: gold; }
        .cards-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; max-height: 400px; overflow-y: auto; }
        .card-item { background: #0f3460; border-radius: 10px; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; }
        .card-item.selected { border-color: #e94560; background: #16213e; }
        button { background: #e94560; color: white; border: none; padding: 16px; border-radius: 15px; font-size: 20px; font-weight: bold; width: 100%; cursor: pointer; margin: 10px 0; }
        button:disabled { background: #444; cursor: not-allowed; }
        .status { text-align: center; color: #888; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 LOKI BINGO</h1>
        <div class="timer-box">
            <div style="color:#888">TIME TO SELECT CARD</div>
            <div class="timer-number" id="timer">30</div>
            <div style="color:#888">seconds</div>
        </div>
        <div class="stats">
            <div class="stat"><span class="stat-value" id="players">0</span><br>Players</div>
            <div class="stat"><span class="stat-value" id="selected">0</span><br>Selected</div>
            <div class="stat"><span class="stat-value" id="prize">0</span><br>Prize</div>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
        <button id="selectBtn" disabled>SELECT CARD (100 coins)</button>
        <div class="status" id="status">Choose a card...</div>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.ready();
        tg.expand();

        const playerId = tg.initDataUnsafe?.user?.id || 'guest_' + Math.random();
        const playerName = tg.initDataUnsafe?.user?.first_name || 'Player';
        const socket = io();

        let selectedIndex = -1;
        let allCards = [];
        let balance = 1250;

        socket.emit('join', { playerId, playerName });

        socket.on('gameState', (data) => {
            allCards = data.cards;
            document.getElementById('players').textContent = data.playerCount;
            document.getElementById('selected').textContent = data.selectedCount;
            document.getElementById('prize').textContent = data.prizePool;
            document.getElementById('timer').textContent = data.cartelaTimer;
            balance = data.balance || 1250;
            renderCards();
        });

        socket.on('cartelaTimer', (time) => {
            document.getElementById('timer').textContent = time;
        });

        socket.on('cardSelected', (data) => {
            document.getElementById('selected').textContent = data.selectedCount;
            document.getElementById('prize').textContent = data.prizePool;
        });

        socket.on('balance', (bal) => {
            balance = bal;
        });

        socket.on('phaseChange', (phase) => {
            if (phase === 'game') {
                window.location.href = '/game';
            }
        });

        function renderCards() {
            let html = '';
            for (let i = 0; i < Math.min(50, allCards.length); i++) {
                let isSelected = (selectedIndex === i);
                html += `<div class="card-item ${isSelected ? 'selected' : ''}" onclick="selectCard(${i})">Card #${i+1}</div>`;
            }
            document.getElementById('cardsGrid').innerHTML = html;
        }

        window.selectCard = function(index) {
            selectedIndex = index;
            document.getElementById('selectBtn').disabled = false;
            renderCards();
        };

        document.getElementById('selectBtn').onclick = () => {
            if (selectedIndex >= 0) {
                socket.emit('selectCard', { playerId, cardIndex: selectedIndex });
                document.getElementById('selectBtn').disabled = true;
                document.getElementById('selectBtn').textContent = '✓ SELECTED';
            }
        };
    </script>
</body>
</html>

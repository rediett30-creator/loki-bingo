<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loki Games - Lobby</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; text-align: center; }
        h1 { color: #e94560; font-size: 48px; margin: 20px 0; }
        .balance { background: #16213e; padding: 15px; border-radius: 15px; margin: 20px 0; font-size: 24px; color: gold; }
        .bingo-btn { background: linear-gradient(135deg, #e94560, #ff6b6b); color: white; border: none; padding: 30px; border-radius: 20px; font-size: 36px; font-weight: bold; width: 100%; margin: 20px 0; cursor: pointer; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .game-card { background: #16213e; padding: 20px; border-radius: 15px; margin: 15px 0; cursor: pointer; border: 1px solid #e94560; }
        .support { background: #0f3460; padding: 15px; border-radius: 15px; margin: 20px 0; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 LOKI GAMES</h1>
        <div class="balance" id="balance">⭐ 1,250</div>
        <button class="bingo-btn" onclick="playBingo()">🎲 PLAY BINGO (14)</button>
        <div class="game-card" onclick="alert('Coming soon!')">🎴 LUDO - Coming Soon</div>
        <div class="game-card" onclick="alert('Coming soon!')">🎯 CRAZY - Coming Soon</div>
        <div class="support" onclick="contactSupport()">📞 Contact Support</div>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.ready();
        tg.expand();

        function playBingo() {
            window.location.href = '/';
        }

        function contactSupport() {
            tg.openTelegramLink('https://t.me/+251922427297');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loki Bingo - Game</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #1a1a2e; color: white; padding: 16px; }
        .container { max-width: 500px; margin: 0 auto; }
        h1 { color: #e94560; text-align: center; font-size: 36px; margin: 20px 0; }
        .current-number { background: #16213e; padding: 40px; border-radius: 20px; text-align: center; font-size: 72px; color: #e94560; margin: 20px 0; border: 3px solid #e94560; }
        .called-box { background: #0f3460; padding: 15px; border-radius: 15px; margin: 20px 0; }
        .called-numbers { display: flex; flex-wrap: wrap; gap: 8px; }
        .called-number { background: #e94560; padding: 8px 15px; border-radius: 25px; font-size: 16px; }
        .bingo-card { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #16213e; padding: 20px; border-radius: 20px; margin: 20px 0; }
        .header-cell { text-align: center; font-size: 24px; color: #e94560; font-weight: bold; }
        .cell { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #0f3460; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; }
        .cell.marked { background: #e94560; }
        .cell.free { background: #4ecdc4; }
        .bingo-btn { background: #e94560; color: white; border: none; padding: 20px; border-radius: 15px; font-size: 28px; font-weight: bold; width: 100%; cursor: pointer; margin: 20px 0; }
        .prize { background: gold; color: #1a1a2e; padding: 10px; border-radius: 10px; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎰 LOKI BINGO</h1>
        <div class="prize" id="prize">💰 Prize Pool: 0</div>
        <div class="current-number" id="currentNumber">🎲</div>
        <div class="called-box">
            <div style="margin-bottom:10px;">📢 Called Numbers</div>
            <div class="called-numbers" id="calledNumbers"></div>
        </div>
        <div class="bingo-card" id="bingoCard">
            <div class="header-cell">B</div><div class="header-cell">I</div><div class="header-cell">N</div><div class="header-cell">G</div><div class="header-cell">O</div>
        </div>
        <button class="bingo-btn" id="bingoBtn">🔴 BINGO!</button>
        <div class="status" id="status" style="text-align:center; color:#888;">Game in progress...</div>
    </div>

    <script>
        const tg = Telegram.WebApp;
        tg.ready();
        tg.expand();

        const playerId = tg.initDataUnsafe?.user?.id || 'guest_' + Math.random();
        const socket = io();

        let myCard = null;
        let calledNumbers = [];
        let markedCells = new Set();

        socket.emit('join', { playerId, playerName: 'Player' });

        socket.on('gameState', (data) => {
            if (data.phase === 'game') {
                document.getElementById('prize').textContent = `💰 Prize Pool: ${data.prizePool}`;
                calledNumbers = data.calledNumbers || [];
                updateCalledNumbers();
            }
        });

        socket.on('yourCard', (card) => {
            myCard = card;
            renderCard();
        });

        socket.on('numberCalled', (data) => {
            document.getElementById('currentNumber').textContent = `🎲 ${data.number}`;
            calledNumbers = data.called;
            updateCalledNumbers();
            if (myCard) renderCard();
        });

        socket.on('gameWon', (data) => {
            document.getElementById('status').textContent = `🏆 WINNER: ${data.name} - ${data.prize} coins!`;
            document.getElementById('bingoBtn').disabled = true;
            setTimeout(() => {
                window.location.href = '/';
            }, 5000);
        });

        socket.on('phaseChange', (phase) => {
            if (phase === 'cartela') {
                window.location.href = '/';
            }
        });

        function updateCalledNumbers() {
            const container = document.getElementById('calledNumbers');
            container.innerHTML = '';
            calledNumbers.slice(-15).forEach(num => {
                const span = document.createElement('span');
                span.className = 'called-number';
                span.textContent = num;
                container.appendChild(span);
            });
        }

        function renderCard() {
            if (!myCard) return;
            let html = '';
            for (let h of ['B','I','N','G','O']) {
                html += `<div class="header-cell">${h}</div>`;
            }
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    let val = myCard[r][c];
                    let isMarked = val === 'FREE' || calledNumbers.includes(val) || markedCells.has(`${r}-${c}`);
                    let cellClass = 'cell';
                    if (val === 'FREE') cellClass += ' free';
                    if (isMarked) cellClass += ' marked';
                    html += `<div class="${cellClass}" onclick="markCell(${r}, ${c}, ${val === 'FREE' ? 0 : val})">${val === 'FREE' ? '⭐' : val}</div>`;
                }
            }
            document.getElementById('bingoCard').innerHTML = html;
        }

        window.markCell = function(row, col, number) {
            if (number === 0) {
                tg.showAlert('FREE space is always marked!');
                return;
            }
            if (!calledNumbers.includes(number)) {
                tg.showAlert(`Number ${number} hasn't been called yet!`);
                return;
            }
            let key = `${row}-${col}`;
            if (markedCells.has(key)) {
                markedCells.delete(key);
            } else {
                markedCells.add(key);
            }
            renderCard();
        };

        document.getElementById('bingoBtn').onclick = () => {
            socket.emit('bingo', { playerId });
            document.getElementById('bingoBtn').disabled = true;
        };
    </script>
</body>
</html>
